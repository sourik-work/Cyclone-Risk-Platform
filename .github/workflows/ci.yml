name: Continuous Integration & Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test & Coverage (Python 3.12)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite with Coverage Gate (>=85%)
        env:
          TESTING: 'true'
          GEMINI_API_KEY: 'ci-mock-key'
        run: |
          pytest --cov=backend --cov-report=term-missing --cov-report=xml backend/tests/

      - name: Run Synthetic Staleness & Circuit Breaker Test
        env:
          TESTING: 'true'
        run: |
          pytest backend/tests/test_health_freshness.py -v -k "test_staleness_status_degraded_when_imd_delayed or test_circuit_breaker_trips"

  frontend-test:
    name: Frontend Test & Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Component & Actuarial Tests
        run: npm test

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_BACKEND_URL: 'http://localhost:8000'
        run: npm run build

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: |
          docker build -t cyclone-risk-backend:ci -f backend/Dockerfile .
