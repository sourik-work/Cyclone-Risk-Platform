steps:
  # 1. Build multi-stage Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cyclone-risk-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cyclone-risk-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'
    id: 'build-image'

  # 2. Push image to Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cyclone-risk-backend:$COMMIT_SHA']
    id: 'push-image'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cyclone-risk-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cyclone-risk-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '20'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '60s'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest,INTERNAL_SERVICE_SECRET=INTERNAL_SERVICE_SECRET:latest'
    id: 'deploy-cloud-run'

images:
  - 'gcr.io/$PROJECT_ID/cyclone-risk-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/cyclone-risk-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
