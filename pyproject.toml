[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclone-risk-platform"
version = "1.0.0"
description = "AI-powered predictive risk & vulnerability modeling system for Bay of Bengal cyclones"
authors = [{ name = "Cyclone Platform Engineering" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "slowapi>=0.1.9",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["backend"]
branch = true
omit = [
    "backend/tests/*",
    "backend/bootstrap.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
paths_to_mutate = "backend/services/insurance_service.py,backend/services/forecast_service.py"
backup = false
runner = "python -m pytest backend/tests/test_insurance_calibration.py backend/tests/test_forecast_validation.py"
